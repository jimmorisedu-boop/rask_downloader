name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # vendor/ вкомпилирован в расширение и не пересобирается в CI -
      # проверяем, что он не подменён и не тянет код из сети.
      - name: Verify vendor
        run: npm run vendor:verify
